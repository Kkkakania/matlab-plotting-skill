name: First-use feedback
description: Share a fresh-clone or first-render test result.
title: "[First-use]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the skill. Please share commands and summaries, not private data files.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, MATLAB version, and how MATLAB is launched.
      placeholder: "macOS 15, MATLAB R2025a, MATLAB_BIN=/Applications/MATLAB_R2025a.app/bin/matlab"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Fresh-clone commit or branch tested.
      placeholder: "main at abc1234"
    validations:
      required: true
  - type: dropdown
    id: data_type
    attributes:
      label: Data type tested
      options:
        - CSV
        - Excel
        - MAT
        - Bundled example data
        - Metadata-only commands
    validations:
      required: true
  - type: input
    id: goal_text
    attributes:
      label: Goal text
      description: Goal text passed to --goal, or "explicit scheme" when you selected a scheme directly.
      placeholder: "show a time trend"
    validations:
      required: false
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Include commands such as --check, --inspect-data, --plan-only, or rendering. Redact local private paths.
      render: bash
    validations:
      required: true
  - type: textarea
    id: doctor_summary
    attributes:
      label: Doctor summary
      description: Paste the overall status and failed/warn checks from first_use_doctor.md/json. Do not paste full local paths.
      placeholder: |
        Overall status:
        Failed or warn checks:
    validations:
      required: false
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What worked, what failed, which scheme was selected, and which output formats were produced?
    validations:
      required: true
  - type: textarea
    id: report_summary
    attributes:
      label: Report summary
      description: Paste selected scheme, top alternatives, output formats, and warnings from render_report.md/json. Do not paste private data.
    validations:
      required: false
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs actual
      description: State the expected result and the actual result, especially for confusing choices or failures.
      placeholder: |
        Expected result:
        Actual result:
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and provenance
      options:
        - label: I did not upload private data, credentials, copied paper figures, or raw third-party plotting code.
          required: true
        - label: I redacted local absolute paths if they identify private folders.
          required: true
        - label: I confirmed private details are redacted from commands and report snippets.
          required: true
