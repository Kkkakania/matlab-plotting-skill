name: First-use feedback
description: Share a fresh-clone or first-render test result.
title: "[First-use]: "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing the skill. Please share commands and summaries, not private data files.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, MATLAB version, and how MATLAB is launched.
      placeholder: "macOS 15, MATLAB R2025a, MATLAB_BIN=/Applications/MATLAB_R2025a.app/bin/matlab"
    validations:
      required: true
  - type: dropdown
    id: data_type
    attributes:
      label: Data type tested
      options:
        - CSV
        - Excel
        - MAT
        - Bundled example data
        - Metadata-only commands
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Include commands such as --check, --inspect-data, --plan-only, or rendering. Redact local private paths.
      render: bash
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What worked, what failed, and which scheme was selected?
    validations:
      required: true
  - type: textarea
    id: report_summary
    attributes:
      label: Report summary
      description: Paste the scheme name, alternatives, and warnings from render_report.md/json. Do not paste private data.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and provenance
      options:
        - label: I did not upload private data, credentials, copied paper figures, or raw third-party plotting code.
          required: true
        - label: I redacted local absolute paths if they identify private folders.
          required: true
