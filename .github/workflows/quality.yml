      - name: Forbidden files
        run: scripts/check_forbidden_files.sh
      - name: Privacy scan
        run: scripts/check_privacy.sh
      - name: Skill validation
        run: python3 scripts/validate_skill.py
      - name: Build automation manifest
        run: python3 scripts/build_automation_manifest.py --out automation-manifest.json
      - name: Upload automation manifest
        uses: actions/upload-artifact@v4
        with:
          name: automation-manifest
          path: automation-manifest.json
      - name: Build 500-task plan
        run: python3 scripts/build_task_manifest.py --json-out task-manifest.json --markdown-out task-board.md --status-overrides docs/task-status.json
      - name: Upload 500-task plan
        uses: actions/upload-artifact@v4
        with:
          name: task-plan
          path: |
            task-manifest.json
            task-board.md
